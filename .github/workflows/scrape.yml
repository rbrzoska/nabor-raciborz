name: Scrape nabór data

on:
  schedule:
    # Co 30 minut (GitHub Actions min granularity = 5 min)
    - cron: '*/30 * * * *'
  workflow_dispatch:   # ← ręczne uruchomienie z GitHub UI / CLI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scraper.js
        # Jeśli chcesz zobaczyć przeglądarkę w logach (debug):
        # run: node scraper.js --headless false
        # (bezsensu w CI, ale zostawiam jako komentarz)

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raciborz.json
          # Commit tylko jeśli plik się zmienił
          git diff --staged --quiet && echo "No changes, skipping commit." || \
            git commit -m "data: update nabor raciborz $(date -u +%Y-%m-%dT%H:%M)Z"

      - name: Push
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
